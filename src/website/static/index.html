<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="app_title">Video notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="is-header">
  <div class="is-header__inner">
    <a class="is-home" href="#" data-i18n-attr="aria-label:home_aria">
      <!-- Black SVG shown white via filter: invert(1). Replace with your own logo. -->
      <svg class="is-logo" viewBox="0 0 44 44" aria-hidden="true">
        <rect x="6" y="6" width="32" height="32" rx="9" fill="none" stroke="#000" stroke-width="3"/>
        <path d="M14 18h16M17 22h10M20 26h4" stroke="#000" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span class="is-divider" aria-hidden="true"></span>
      <span>
        <span class="is-header__title" data-i18n="app_title">Video notes</span><br>
        <span class="is-header__sub" data-i18n="sub">Upload a video, get notes</span>
      </span>
    </a>
    <nav class="is-tabs" data-i18n-attr="aria-label:pages_aria">
      <a class="is-tab" href="index.html" aria-current="page" data-i18n="app_title">Video notes</a>
      <a class="is-tab" href="dedupe.html" data-i18n="dedupe_title">Remove duplicates</a>
    </nav>
    <span class="is-header__spacer"></span>
    <span class="is-header-chip" id="apiChip">Backend: <span class="is-mono"></span></span>
    <div class="is-lang" role="group" data-i18n-attr="aria-label:lang_aria">
      <button type="button" data-lang="en" lang="en" aria-pressed="true">EN</button>
    </div>
    <button class="is-theme-btn" id="themeBtn" type="button" data-i18n-attr="aria-label:theme_aria">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="is-hero anim">
    <h1 data-i18n="hero_h1">Turn videos into notes</h1>
    <p data-i18n="hero_p"></p>
    <ol class="is-steps" data-i18n-attr="aria-label:steps_aria">
      <li class="is-step is-active" data-step="1"><span class="is-step__n">1</span><span data-i18n="step_choose"></span></li>
      <li class="is-step" data-step="2"><span class="is-step__n">2</span><span data-i18n="step_create"></span></li>
      <li class="is-step" data-step="3"><span class="is-step__n">3</span><span data-i18n="step_download"></span></li>
    </ol>
  </section>

  <div class="grid-2">
    <!-- Upload -->
    <section class="is-card anim anim-2" aria-labelledby="uploadTitle">
      <h2 class="is-section-title" id="uploadTitle">
        <span class="is-icon-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg></span>
        <span data-i18n="files_title"></span>
      </h2>

      <label class="is-drop is-graph-surface" id="dropZone" tabindex="0">
        <input type="file" id="fileInput" multiple accept="video/*,.mkv,.m4v">
        <span class="is-drop__icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 18v-6M9 15l3-3 3 3"/></svg>
        </span>
        <span class="is-drop__title" data-i18n="drop_title"></span>
        <span class="is-drop__hint" data-i18n="drop_hint"></span>
        <span class="is-drop__hint" id="limitHint"></span>
      </label>
      <input type="file" id="folderInput" webkitdirectory multiple hidden>
      <div class="is-folder-row">
        <button class="is-btn is-btn--ghost is-btn--sm" id="folderBtn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span data-i18n="folder_btn"></span>
        </button>
        <span class="is-drop__hint" data-i18n="folder_hint"></span>
      </div>

      <div class="is-queue-head" id="queueHead" hidden></div>
      <div class="is-list" id="fileList" role="list">
        <div class="is-empty" id="emptyState" data-i18n="no_files"></div>
      </div>

      <fieldset class="is-options" id="speakerOptions">
        <label class="is-check">
          <input type="checkbox" id="summaryInput" checked>
          <span data-i18n="opt_summary"></span>
        </label>
        <label class="is-check">
          <input type="checkbox" id="keywordsInput">
          <span data-i18n="opt_keywords"></span>
        </label>
        <label class="is-check">
          <input type="checkbox" id="speakersInput">
          <span data-i18n="opt_speakers"></span>
        </label>
        <label class="is-number" id="numSpeakersLabel">
          <span data-i18n="num_speakers"></span>
          <input type="number" id="numSpeakersInput" min="1" max="20" placeholder="auto" inputmode="numeric">
        </label>
        <p class="is-options__hint" data-i18n="options_hint"></p>
      </fieldset>

      <div class="is-actions">
        <button class="is-btn" id="startBtn" type="button" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>
          <span data-i18n="start"></span>
        </button>
        <button class="is-btn is-btn--ghost" id="clearBtn" type="button" disabled data-i18n="clear"></button>
      </div>
    </section>

    <!-- Results -->
    <section class="is-card is-lift anim anim-3" aria-labelledby="resultTitle" aria-live="polite">
      <h2 class="is-section-title" id="resultTitle">
        <span class="is-icon-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg></span>
        <span data-i18n="results"></span>
      </h2>
      <div id="resultBody"></div>
    </section>
  </div>
</main>

<script src="i18n.js" defer></script>
<script src="function.js" defer></script>
</body>
</html>
